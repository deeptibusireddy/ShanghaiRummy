name: iOS Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (iPad)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVICE_FAMILY: iPad
      RESULT_BUNDLE: TestResults-iPad.xcresult

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen, xcbeautify, and xcparse
        run: brew install xcodegen xcbeautify chargepoint/xcparse/xcparse

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify iPad-only target
        run: |
          TARGET_DEVICE_FAMILY=$(xcodebuild \
            -project ShanghaiRummy.xcodeproj \
            -target ShanghaiRummy \
            -configuration Debug \
            -showBuildSettings \
            | awk -F ' = ' '/TARGETED_DEVICE_FAMILY/ { print $2; exit }')
          if [ "$TARGET_DEVICE_FAMILY" != "2" ]; then
            echo "Expected TARGETED_DEVICE_FAMILY=2, got '$TARGET_DEVICE_FAMILY'"
            exit 1
          fi

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Build & test
        run: |
          set -o pipefail
          # Pick the first available device in the iPad family instead of
          # pinning to a runtime that may rotate off the hosted runner.
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,os,sys; d=json.load(sys.stdin)["devices"]; \
              family=os.environ["DEVICE_FAMILY"]; \
              picks=[dev for k,v in d.items() if "iOS" in k for dev in v if family in dev["name"]]; \
              print(picks[0]["udid"])')
          echo "Using $DEVICE_FAMILY simulator: $DEVICE_ID"
          xcodebuild \
            -project ShanghaiRummy.xcodeproj \
            -scheme ShanghaiRummy \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -configuration Debug \
            -resultBundlePath "$RESULT_BUNDLE" \
            -retry-tests-on-failure \
            CODE_SIGNING_ALLOWED=NO \
            build test \
            | xcbeautify --renderer github-actions

      - name: Extract screenshots from test results
        if: always()
        run: |
          if [ -d "$RESULT_BUNDLE" ]; then
            mkdir -p screenshots
            xcparse screenshots "$RESULT_BUNDLE" screenshots/ || true
            ls -la screenshots/ || true
          else
            echo "No xcresult bundle found — skipping"
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots-iPad
          path: screenshots/
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-iPad
          path: ${{ env.RESULT_BUNDLE }}
          if-no-files-found: ignore

  game-simulation:
    name: Simulate 1,000 Games (${{ matrix.player_count }} Players)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        player_count: [2, 3, 4, 5, 6]
    env:
      PLAYER_COUNT: ${{ matrix.player_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build release simulator
        run: |
          swift build -c release --product GameSimulationCLI
          echo "SIMULATOR=$(swift build -c release --show-bin-path)/GameSimulationCLI" \
            >> "$GITHUB_ENV"

      - name: Simulate games 1–50
        run: $SIMULATOR --players $PLAYER_COUNT --start 1 --count 50 --output simulation-reports/${PLAYER_COUNT}p-0001-0050.json

      - name: Simulate games 51–100
        run: $SIMULATOR --players $PLAYER_COUNT --start 51 --count 50 --output simulation-reports/${PLAYER_COUNT}p-0051-0100.json

      - name: Simulate games 101–150
        run: $SIMULATOR --players $PLAYER_COUNT --start 101 --count 50 --output simulation-reports/${PLAYER_COUNT}p-0101-0150.json

      - name: Simulate games 151–200
        run: $SIMULATOR --players $PLAYER_COUNT --start 151 --count 50 --output simulation-reports/${PLAYER_COUNT}p-0151-0200.json

      - name: Simulate games 201–250
        run: $SIMULATOR --players $PLAYER_COUNT --start 201 --count 50 --output simulation-reports/${PLAYER_COUNT}p-0201-0250.json

      - name: Simulate games 251–300
        run: $SIMULATOR --players $PLAYER_COUNT --start 251 --count 50 --output simulation-reports/${PLAYER_COUNT}p-0251-0300.json

      - name: Simulate games 301–350
        run: $SIMULATOR --players $PLAYER_COUNT --start 301 --count 50 --output simulation-reports/${PLAYER_COUNT}p-0301-0350.json

      - name: Simulate games 351–400
        run: $SIMULATOR --players $PLAYER_COUNT --start 351 --count 50 --output simulation-reports/${PLAYER_COUNT}p-0351-0400.json

      - name: Simulate games 401–450
        run: $SIMULATOR --players $PLAYER_COUNT --start 401 --count 50 --output simulation-reports/${PLAYER_COUNT}p-0401-0450.json

      - name: Simulate games 451–500
        run: $SIMULATOR --players $PLAYER_COUNT --start 451 --count 50 --output simulation-reports/${PLAYER_COUNT}p-0451-0500.json

      - name: Simulate games 501–550
        run: $SIMULATOR --players $PLAYER_COUNT --start 501 --count 50 --output simulation-reports/${PLAYER_COUNT}p-0501-0550.json

      - name: Simulate games 551–600
        run: $SIMULATOR --players $PLAYER_COUNT --start 551 --count 50 --output simulation-reports/${PLAYER_COUNT}p-0551-0600.json

      - name: Simulate games 601–650
        run: $SIMULATOR --players $PLAYER_COUNT --start 601 --count 50 --output simulation-reports/${PLAYER_COUNT}p-0601-0650.json

      - name: Simulate games 651–700
        run: $SIMULATOR --players $PLAYER_COUNT --start 651 --count 50 --output simulation-reports/${PLAYER_COUNT}p-0651-0700.json

      - name: Simulate games 701–750
        run: $SIMULATOR --players $PLAYER_COUNT --start 701 --count 50 --output simulation-reports/${PLAYER_COUNT}p-0701-0750.json

      - name: Simulate games 751–800
        run: $SIMULATOR --players $PLAYER_COUNT --start 751 --count 50 --output simulation-reports/${PLAYER_COUNT}p-0751-0800.json

      - name: Simulate games 801–850
        run: $SIMULATOR --players $PLAYER_COUNT --start 801 --count 50 --output simulation-reports/${PLAYER_COUNT}p-0801-0850.json

      - name: Simulate games 851–900
        run: $SIMULATOR --players $PLAYER_COUNT --start 851 --count 50 --output simulation-reports/${PLAYER_COUNT}p-0851-0900.json

      - name: Simulate games 901–950
        run: $SIMULATOR --players $PLAYER_COUNT --start 901 --count 50 --output simulation-reports/${PLAYER_COUNT}p-0901-0950.json

      - name: Simulate games 951–1,000
        run: $SIMULATOR --players $PLAYER_COUNT --start 951 --count 50 --output simulation-reports/${PLAYER_COUNT}p-0951-1000.json

      - name: Upload simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-simulation-results-${{ matrix.player_count }}-players
          path: simulation-reports/
          if-no-files-found: warn
