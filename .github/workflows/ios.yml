name: iOS Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build-and-test:
    name: Build & Test (iPad)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVICE_FAMILY: iPad
      RESULT_BUNDLE: TestResults-iPad.xcresult

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen, xcbeautify, and xcparse
        run: brew install xcodegen xcbeautify chargepoint/xcparse/xcparse

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify iPad-only target
        run: |
          TARGET_DEVICE_FAMILY=$(xcodebuild \
            -project ShanghaiRummy.xcodeproj \
            -target ShanghaiRummy \
            -configuration Debug \
            -showBuildSettings \
            | awk -F ' = ' '/TARGETED_DEVICE_FAMILY/ { print $2; exit }')
          if [ "$TARGET_DEVICE_FAMILY" != "2" ]; then
            echo "Expected TARGETED_DEVICE_FAMILY=2, got '$TARGET_DEVICE_FAMILY'"
            exit 1
          fi

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Build & test
        run: |
          set -o pipefail
          # Pick the first available device in the iPad family instead of
          # pinning to a runtime that may rotate off the hosted runner.
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,os,sys; d=json.load(sys.stdin)["devices"]; \
              family=os.environ["DEVICE_FAMILY"]; \
              picks=[dev for k,v in d.items() if "iOS" in k for dev in v if family in dev["name"]]; \
              print(picks[0]["udid"])')
          echo "Using $DEVICE_FAMILY simulator: $DEVICE_ID"
          xcodebuild \
            -project ShanghaiRummy.xcodeproj \
            -scheme ShanghaiRummy \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -configuration Debug \
            -resultBundlePath "$RESULT_BUNDLE" \
            -retry-tests-on-failure \
            CODE_SIGNING_ALLOWED=NO \
            build test \
            | xcbeautify --renderer github-actions

      - name: Extract screenshots from test results
        if: always()
        run: |
          if [ -d "$RESULT_BUNDLE" ]; then
            mkdir -p screenshots
            xcparse screenshots "$RESULT_BUNDLE" screenshots/ || true
            ls -la screenshots/ || true
          else
            echo "No xcresult bundle found — skipping"
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots-iPad
          path: screenshots/
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-iPad
          path: ${{ env.RESULT_BUNDLE }}
          if-no-files-found: ignore

  game-simulation:
    name: Simulate 1,000 Games (${{ matrix.player_count }} Players)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        player_count: [2, 3, 4, 5, 6]
    env:
      PLAYER_COUNT: ${{ matrix.player_count }}
      DERIVED_DATA: SimulationDerivedData-${{ matrix.player_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen, xcbeautify, and xcparse
        run: brew install xcodegen xcbeautify chargepoint/xcparse/xcparse

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select iPad simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; \
              picks=[dev for k,v in d.items() if "iOS" in k for dev in v if "iPad" in dev["name"]]; \
              print(picks[0]["udid"])')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Create progress comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$GITHUB_REF_NAME" \
            --state open \
            --json number \
            --jq '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            COMMENT_ID=$(gh api \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="🤖 **${PLAYER_COUNT}-player simulation:** 0 / 1,000 games complete." \
              --jq .id)
            echo "COMMENT_ID=$COMMENT_ID" >> "$GITHUB_ENV"
          fi

      - name: Build simulation tests
        run: |
          set -o pipefail
          xcodebuild \
            -project ShanghaiRummy.xcodeproj \
            -scheme ShanghaiRummy \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) RUN_GAME_SIMULATIONS SIMULATE_PLAYER_COUNT_${{ matrix.player_count }}' \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing \
            | xcbeautify --renderer github-actions

      - name: Run simulation batches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p simulation-logs simulation-reports simulation-results
          for BATCH in $(seq 0 19); do
            TEST_NAME=$(printf "testBatch%02d" "$BATCH")
            RESULT_BUNDLE="simulation-results/${PLAYER_COUNT}p-${TEST_NAME}.xcresult"
            LOG_FILE="simulation-logs/${PLAYER_COUNT}p-${TEST_NAME}.log"
            ATTACHMENTS="simulation-results/${PLAYER_COUNT}p-${TEST_NAME}-attachments"

            xcodebuild \
              -project ShanghaiRummy.xcodeproj \
              -scheme ShanghaiRummy \
              -sdk iphonesimulator \
              -destination "platform=iOS Simulator,id=$DEVICE_ID" \
              -configuration Debug \
              -derivedDataPath "$DERIVED_DATA" \
              -resultBundlePath "$RESULT_BUNDLE" \
              -only-testing:ShanghaiRummyTests/GameSimulationTests/$TEST_NAME \
              CODE_SIGNING_ALLOWED=NO \
              test-without-building \
              | tee "$LOG_FILE" \
              | xcbeautify --renderer github-actions

            mkdir -p "$ATTACHMENTS"
            xcparse attachments \
              "$RESULT_BUNDLE" \
              "$ATTACHMENTS" \
              --uti public.json
            REPORT=$(find "$ATTACHMENTS" -type f | head -1)
            if [ -z "$REPORT" ]; then
              echo "Simulation report was not found for $TEST_NAME"
              exit 1
            fi
            cp "$REPORT" \
              "simulation-reports/${PLAYER_COUNT}p-${TEST_NAME}.json"

            COMPLETED=$(( (BATCH + 1) * 50 ))
            echo "::notice title=${PLAYER_COUNT}-player simulation::${COMPLETED} / 1,000 games complete"
            if [ -n "$COMMENT_ID" ]; then
              gh api \
                --method PATCH \
                "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" \
                -f body="🤖 **${PLAYER_COUNT}-player simulation:** ${COMPLETED} / 1,000 games complete."
            fi
          done

      - name: Mark simulation failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$COMMENT_ID" ]; then
            exit 0
          fi
          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" \
            -f body="⚠️ **${PLAYER_COUNT}-player simulation stopped early.** See the workflow logs for the last completed 50-game batch."

      - name: Upload simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-simulation-results-${{ matrix.player_count }}-players
          path: |
            simulation-reports/
            simulation-logs/
          if-no-files-found: warn
