name: iOS Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.device }})
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    env:
      DEVICE_FAMILY: ${{ matrix.device }}
      RESULT_BUNDLE: TestResults-${{ matrix.device }}.xcresult

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen, xcbeautify, and xcparse
        run: brew install xcodegen xcbeautify chargepoint/xcparse/xcparse

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Build & test
        run: |
          set -o pipefail
          # Pick the first available device in this matrix family instead of
          # pinning to a runtime that may rotate off the hosted runner.
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,os,sys; d=json.load(sys.stdin)["devices"]; \
              family=os.environ["DEVICE_FAMILY"]; \
              picks=[dev for k,v in d.items() if "iOS" in k for dev in v if family in dev["name"]]; \
              print(picks[0]["udid"])')
          echo "Using $DEVICE_FAMILY simulator: $DEVICE_ID"
          xcodebuild \
            -project ShanghaiRummy.xcodeproj \
            -scheme ShanghaiRummy \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -configuration Debug \
            -resultBundlePath "$RESULT_BUNDLE" \
            -retry-tests-on-failure \
            CODE_SIGNING_ALLOWED=NO \
            build test \
            | xcbeautify --renderer github-actions

      - name: Extract screenshots from test results
        if: always()
        run: |
          if [ -d "$RESULT_BUNDLE" ]; then
            mkdir -p screenshots
            xcparse screenshots "$RESULT_BUNDLE" screenshots/ || true
            ls -la screenshots/ || true
          else
            echo "No xcresult bundle found — skipping"
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots-${{ matrix.device }}
          path: screenshots/
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.device }}
          path: ${{ env.RESULT_BUNDLE }}
          if-no-files-found: ignore
