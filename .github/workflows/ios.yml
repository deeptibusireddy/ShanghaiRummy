name: iOS Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (iPad)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVICE_FAMILY: iPad
      RESULT_BUNDLE: TestResults-iPad.xcresult

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen, xcbeautify, and xcparse
        run: brew install xcodegen xcbeautify chargepoint/xcparse/xcparse

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify iPad-only target
        run: |
          TARGET_DEVICE_FAMILY=$(xcodebuild \
            -project ShanghaiRummy.xcodeproj \
            -target ShanghaiRummy \
            -configuration Debug \
            -showBuildSettings \
            | awk -F ' = ' '/TARGETED_DEVICE_FAMILY/ { print $2; exit }')
          if [ "$TARGET_DEVICE_FAMILY" != "2" ]; then
            echo "Expected TARGETED_DEVICE_FAMILY=2, got '$TARGET_DEVICE_FAMILY'"
            exit 1
          fi

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Build & test
        run: |
          set -o pipefail
          # Pick the first available device in the iPad family instead of
          # pinning to a runtime that may rotate off the hosted runner.
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,os,sys; d=json.load(sys.stdin)["devices"]; \
              family=os.environ["DEVICE_FAMILY"]; \
              picks=[dev for k,v in d.items() if "iOS" in k for dev in v if family in dev["name"]]; \
              print(picks[0]["udid"])')
          echo "Using $DEVICE_FAMILY simulator: $DEVICE_ID"
          xcodebuild \
            -project ShanghaiRummy.xcodeproj \
            -scheme ShanghaiRummy \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -configuration Debug \
            -resultBundlePath "$RESULT_BUNDLE" \
            -retry-tests-on-failure \
            CODE_SIGNING_ALLOWED=NO \
            build test \
            | xcbeautify --renderer github-actions

      - name: Extract screenshots from test results
        if: always()
        run: |
          if [ -d "$RESULT_BUNDLE" ]; then
            mkdir -p screenshots
            xcparse screenshots "$RESULT_BUNDLE" screenshots/ || true
            ls -la screenshots/ || true
          else
            echo "No xcresult bundle found — skipping"
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots-iPad
          path: screenshots/
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-iPad
          path: ${{ env.RESULT_BUNDLE }}
          if-no-files-found: ignore

  game-simulation:
    name: Simulate 5,000 Games
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      RESULT_BUNDLE: GameSimulationResults.xcresult

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen, xcbeautify, and xcparse
        run: brew install xcodegen xcbeautify chargepoint/xcparse/xcparse

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run 2–6 player simulations
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; \
              picks=[dev for k,v in d.items() if "iOS" in k for dev in v if "iPad" in dev["name"]]; \
              print(picks[0]["udid"])')
          xcodebuild \
            -project ShanghaiRummy.xcodeproj \
            -scheme ShanghaiRummy \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -configuration Debug \
            -resultBundlePath "$RESULT_BUNDLE" \
            -only-testing:ShanghaiRummyTests/GameSimulationTests/testFiveThousandBotGamesComplete \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) RUN_GAME_SIMULATIONS' \
            CODE_SIGNING_ALLOWED=NO \
            test \
            | tee game-simulation.log \
            | xcbeautify --renderer github-actions

      - name: Extract simulation report
        if: always()
        run: |
          mkdir -p simulation-attachments
          xcparse attachments \
            "$RESULT_BUNDLE" \
            simulation-attachments \
            --uti public.json
          REPORT=$(find simulation-attachments -type f | head -1)
          if [ -z "$REPORT" ]; then
            echo "Simulation report attachment was not found"
            exit 1
          fi
          cp "$REPORT" game-simulation-report.json

      - name: Upload simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-simulation-results
          path: |
            game-simulation-report.json
            game-simulation.log
            simulation-attachments/
            ${{ env.RESULT_BUNDLE }}
          if-no-files-found: warn
