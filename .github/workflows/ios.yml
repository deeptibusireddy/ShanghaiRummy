name: iOS Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen, xcbeautify, and xcparse
        run: brew install xcodegen xcbeautify chargepoint/xcparse/xcparse

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Build & test
        run: |
          set -o pipefail
          # Pick the first available iPhone runtime dynamically instead of pinning
          # to a specific iOS version — CI runners rotate what's preinstalled.
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; \
              picks=[dev for k,v in d.items() if "iOS" in k for dev in v if "iPhone" in dev["name"]]; \
              print(picks[0]["udid"])')
          echo "Using simulator: $DEVICE_ID"
          xcodebuild \
            -project ShanghaiRummy.xcodeproj \
            -scheme ShanghaiRummy \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -configuration Debug \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            build test \
            | xcbeautify --renderer github-actions

      - name: Extract screenshots from test results
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            mkdir -p screenshots
            xcparse screenshots TestResults.xcresult screenshots/ || true
            ls -la screenshots/ || true
          else
            echo "No xcresult bundle found — skipping"
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: screenshots/
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
