# XcodeGen spec. Regenerate the .xcodeproj on macOS with: xcodegen generate
name: ShanghaiRummy
options:
  bundleIdPrefix: com.deeptibusireddy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # fill in your Apple Team ID on Mac

targets:
  ShanghaiRummy:
    type: application
    platform: iOS
    sources:
      - path: Sources/ShanghaiRummy
    resources:
      - path: Sources/ShanghaiRummy/Resources
    info:
      path: Sources/ShanghaiRummy/Info.plist
      properties:
        CFBundleDisplayName: Shanghai Rummy Nights
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
    entitlements:
      path: Sources/ShanghaiRummy/ShanghaiRummy.entitlements
      properties:
        com.apple.developer.game-center: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deeptibusireddy.ShanghaiRummy
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "45"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "2"

  ShanghaiRummyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ShanghaiRummyTests
    dependencies:
      - target: ShanghaiRummy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deeptibusireddy.ShanghaiRummyTests
        GENERATE_INFOPLIST_FILE: YES

  ShanghaiRummyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/ShanghaiRummyUITests
    dependencies:
      - target: ShanghaiRummy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deeptibusireddy.ShanghaiRummyUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ShanghaiRummy

schemes:
  ShanghaiRummy:
    build:
      targets:
        ShanghaiRummy: all
        ShanghaiRummyTests: [test]
        ShanghaiRummyUITests: [test]
    test:
      targets:
        - ShanghaiRummyTests
        - ShanghaiRummyUITests
    run:
      config: Debug
    archive:
      config: Release
